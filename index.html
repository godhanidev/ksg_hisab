<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Standalone Color & Capabilities -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KSG Hisab" />
    <meta name="application-name" content="KSG Hisab" />
    
    <title>K.S.Godhani - Construction ERP</title>
    
    <!-- Manifest & App Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preload" href="/logo.png" as="image" />

    <!-- Google Fonts Non-blocking Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Instant Splash Screen Styling (Frame 0 Fast Render) -->
    <style>
      #ksg-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      .ksg-splash-logo {
        width: 88px;
        height: 88px;
        border-radius: 9999px;
        border: 2px solid rgba(245, 158, 11, 0.5);
        box-shadow: 0 0 30px rgba(245, 158, 11, 0.25);
        object-fit: cover;
        animation: ksgPulse 2s infinite ease-in-out;
      }
      .ksg-splash-title {
        margin-top: 18px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.05em;
        color: #ffffff;
      }
      .ksg-splash-sub {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 700;
        color: #f59e0b;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .ksg-splash-bar {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        margin-top: 24px;
        overflow: hidden;
        position: relative;
      }
      .ksg-splash-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
        border-radius: 9999px;
        animation: ksgBarSlide 1.2s infinite ease-in-out;
      }
      @keyframes ksgPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.92; }
      }
      @keyframes ksgBarSlide {
        0% { left: -50%; width: 30%; }
        50% { width: 60%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
  </head>
  <body style="background-color: #020617; margin: 0; padding: 0;">
    <div id="root">
      <!-- Instant Native Boot Splash Screen: Shows instantly on Home Screen tap -->
      <div id="ksg-boot-splash">
        <img src="/logo.png" alt="KSG Logo" class="ksg-splash-logo" />
        <div class="ksg-splash-title">K.S.GODHANI</div>
        <div class="ksg-splash-sub">Civil Works & Construction</div>
        <div class="ksg-splash-bar"></div>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Fast PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('SW register note:', err);
          });
        });
      }
    </script>
  </body>
</html>
